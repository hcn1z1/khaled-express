services:
  db:
    image: postgres:16-alpine
    container_name: khaled_express_db
    environment:
      POSTGRES_DB: khaled_express
      POSTGRES_USER: khaled
      POSTGRES_PASSWORD: express_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khaled -d khaled_express"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: khaled_express_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khaled_express_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "khaled-express-production-secret-key-super-secure"
      POSTGRES_DB: khaled_express
      POSTGRES_USER: khaled
      POSTGRES_PASSWORD: express_password_2026
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "False"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khaled_express_worker
    command: celery -A khaled_express worker -l info
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "khaled-express-production-secret-key-super-secure"
      POSTGRES_DB: khaled_express
      POSTGRES_USER: khaled
      POSTGRES_PASSWORD: express_password_2026
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "False"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  customer-web:
    build:
      context: ./customer-web
      dockerfile: Dockerfile
    container_name: khaled_express_customer_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  pgdata:
