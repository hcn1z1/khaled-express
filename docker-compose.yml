version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: khaled_express_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: khaled_express
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: khaled_express_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: khaled_express_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: khaled_express_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python seed_data.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DB_ENGINE=postgres
      - POSTGRES_DB=khaled_express
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=khaled_express_password_2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: khaled_express_worker
    restart: unless-stopped
    command: >
      sh -c "python -c 'print(\"Khaled Express Mock Notification Worker Started...\"); import time; time.sleep(86400)'"
    volumes:
      - ./backend:/app
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_DB=khaled_express
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=khaled_express_password_2026
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: khaled_express_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
